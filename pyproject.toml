[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "constrained-jepa"
version = "0.1.0"
description = "Test-time constraints for JEPA world-model planning."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "hydra-core>=1.3",
    "numpy>=1.24",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
lewm = [
    "stable-pretraining",
    "stable-worldmodel",
]
notebooks = [
    "imageio[ffmpeg]>=2.37",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
